spring.application.name=SERVICE-PAIEMENT
# Nom de l'application et configuration Eureka

server.port=8086

# Configuration Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.preferIpAddress=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Configuration des fallbacks Feign
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true
# Configuration Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# PostgreSQL Configuration

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://payment-db:5432/paiement
spring.datasource.username=postgres
spring.datasource.password=admin
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuration de resilience RabbitMQ
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.enabled=true
