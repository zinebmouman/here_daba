spring.application.name=Gestion-Stocks
# src/main/resources/application.properties
server.port=8084


spring.datasource.url=jdbc:postgresql://localhost:5432/stock
spring.datasource.username=postgres
spring.datasource.password=zineb123

# Dans application.properties du service de Stocks
produit.service.url=http://product-service:8082


# Autres configurations Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Configuration du client Feign pour PRODUIT-SERVICE
feign.client.config.PRODUIT-SERVICE.connect-timeout=5000
feign.client.config.PRODUIT-SERVICE.read-timeout=5000
# Identification unique du service
eureka.instance.instance-id=${spring.application.name}:${random.value}
# Configuration Resilience4J
resilience4j.circuitbreaker.instances.produitService.eventConsumerBufferSize=10
# Configuration des logs
logging.level.com.stock=INFO

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Logging
logging.level.org.springframework=INFO
logging.level.com.stockservice=DEBUG
# Activation des points de terminaison actuator
management.endpoints.web.exposure.include=*
# Configuration Feign et Circuit Breaker
feign.circuitbreaker.enabled=true
feign.hystrix.enabled=true

# Configuration du client Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
# Configuration specifique pour le service Produit
feign.client.config.BOUTIQUE-CATALOGUE-PRODUITS.connect-timeout=5000
feign.client.config.BOUTIQUE-CATALOGUE-PRODUITS.read-timeout=5000
# Logging detaille
logging.level.com.gestionstocks.client=DEBUG
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
# Configuration Eureka
eureka.client.serviceUrl.defaultZone=ttp://eureka-server:8761/eureka/
eureka.instance.preferIpAddress=true

spring.cloud.discovery.enabled=true
spring.cloud.client.enabled=true
# Configuration Actuator
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Configuration Logging
logging.level.com.gestionstocks=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
# Configuration Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Configuration Resilience4J pour Feign
resilience4j.circuitbreaker.instances.stockService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.stockService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.stockService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.stockService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.stockService.failureRateThreshold=50
# Resilience4J Circuit Breaker
resilience4j.circuitbreaker.instances.produitService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.produitService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.produitService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.produitService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.produitService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.produitService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.produitService.failureRateThreshold=50
spring.main.allow-bean-definition-overriding=true

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
# Configuration RabbitMQ pour Docker sur Windows
spring.rabbitmq.host=rabbitmq

spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Explicitly specify the dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Logging
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE