spring.application.name=NOTIFICATIONS-MESSAGE
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
server.port=8085
# Active le support des fallbacks Feign
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.preferIpAddress=true
# Configuration des logs
logging.level.com.notificationsmessage=DEBUG
# Configuration specifique pour le client
feign.client.config.BOUTIQUE-CATALOGUE-PRODUITS.connect-timeout=5000
feign.client.config.BOUTIQUE-CATALOGUE-PRODUITS.read-timeout=5000
# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=postgres
spring.datasource.password=zineb123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configuration RabbitMQ pour Docker sur Windows
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Desactiver les verifications de sante si elles causent des problemes
management.health.db.enabled=false
# Optionnel : Desactiver la verification de sante RabbitMQ au demarrage
management.health.rabbit.enabled=false
eureka.instance.instance-id=${spring.application.name}:${random.value}


spring.rabbitmq.template.retry.multiplier=1.0
# Logging
logging.level.org.springframework=INFO
logging.level.com.notifications=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG


spring.main.allow-bean-definition-overriding=true
# Configurations de resilience
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jihadelazaar@gmail.com
spring.mail.password=mkmdtyecvgxqqdks
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Configuration des logs pour la profondeur de debogage
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.gestionstocks=TRACE
logging.level.org.hibernate=TRACE
# Log SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Configuration pour afficher les exceptions completes
server.error.include-stacktrace=always
# CORS Configuration
spring.mvc.cors.enabled=true
# Active les taches planifiees
spring.task.scheduling.enabled=true
# Configuration des taches planifiees
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread.name-prefix=scheduled-task-