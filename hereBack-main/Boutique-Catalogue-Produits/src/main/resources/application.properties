# ================================
# CONFIGURATION RAG INTÉGRÉE - À AJOUTER à application.properties
# ================================

# ================== CONFIGURATION RAG PRINCIPALE ==================
# Activation du système RAG
rag.enabled=true
rag.version=1.0
rag.environment=development

# ================== CONFIGURATION GEMINI AI POUR RAG ==================
# Configuration IA pour RAG (à ajouter à la config Gemini existante)
gemini.rag.enabled=true
gemini.rag.temperature=0.3
gemini.rag.maxTokens=1500
gemini.rag.topP=0.8
gemini.rag.topK=40
gemini.rag.responseFormat=json

# Modèles Gemini pour différents types de recherche
gemini.rag.model.search=gemini-1.5-pro-latest
gemini.rag.model.analysis=gemini-1.5-pro-latest
gemini.rag.model.summarization=gemini-1.5-flash

# ================== CONFIGURATION CACHE RAG ==================
# Cache pour les résultats de recherche RAG
rag.cache.enabled=true
rag.cache.duration.minutes=10
rag.cache.max.size=100
rag.cache.cleanup.interval.minutes=5

# Cache spécialisé par type de recherche
rag.cache.produits.duration.minutes=15
rag.cache.boutiques.duration.minutes=20
rag.cache.search.duration.minutes=10

# ================== CONFIGURATION PERFORMANCE RAG ==================
# Limites de performance
rag.search.max.results=50
rag.search.max.concurrent=5
rag.search.timeout.seconds=30

# Seuils de similarité
rag.similarity.threshold.minimum=0.3
rag.similarity.threshold.good=0.6
rag.similarity.threshold.excellent=0.8

# Longueur maximale du contexte
rag.context.max.length=5000
rag.context.max.sentences=20

# ================== CONFIGURATION SCORING RAG ==================
# Poids pour le scoring intelligent
rag.scoring.keyword.weight=0.4
rag.scoring.text-similarity.weight=0.3
rag.scoring.category.weight=0.2
rag.scoring.price.weight=0.1
rag.scoring.location.weight=0.15
rag.scoring.availability.weight=0.05

# Bonus de scoring
rag.scoring.exact-match.bonus=0.2
rag.scoring.partial-match.bonus=0.1
rag.scoring.fuzzy-match.bonus=0.05

# ================== CONFIGURATION RECHERCHE INTELLIGENTE ==================
# Types de recherche supportés
rag.search.types=intelligent,classic,advanced,semantic,fuzzy

# Configuration recherche sémantique
rag.semantic.enabled=true
rag.semantic.model=sentence-transformers
rag.semantic.similarity.method=cosine

# Configuration recherche floue
rag.fuzzy.enabled=true
rag.fuzzy.distance.algorithm=levenshtein
rag.fuzzy.max.distance=3

# ================== CONFIGURATION CATÉGORIES INTELLIGENTES ==================
# Mapping des catégories pour la recherche intelligente
rag.categories.electronique=electronique,informatique,telephone,tv,audio,gaming,ordinateur
rag.categories.vetements=vetements,mode,fashion,textile,chaussures,accessoires
rag.categories.sport=sport,fitness,outdoor,running,musculation,yoga,cyclisme
rag.categories.beaute=beaute,cosmetique,parfum,soin,makeup,hygiene
rag.categories.maison=maison,decoration,meuble,cuisine,jardin,bricolage
rag.categories.livres=livres,education,litterature,bande-dessinee,manuel
rag.categories.jouets=jouets,jeux,enfants,bebe,loisirs
rag.categories.auto=automobile,moto,pieces,accessoires,entretien

# Synonymes pour améliorer la recherche
rag.synonymes.telephone=mobile,portable,smartphone,gsm
rag.synonymes.ordinateur=pc,laptop,computer,bureau
rag.synonymes.vetements=habits,fringues,textiles,mode
rag.synonymes.chaussures=souliers,baskets,sneakers,bottes

# ================== CONFIGURATION GÉOGRAPHIQUE ==================
# Villes principales du Maroc pour la recherche géographique
rag.cities.principales=Casablanca,Rabat,Marrakech,Fes,Tanger,Agadir,Meknes,Oujda,Kenitra,Tetouan
rag.cities.casablanca.related=Mohammedia,Sale,Benslimane,Berrechid
rag.cities.rabat.related=Sale,Kenitra,Temara,Skhirat
rag.cities.marrakech.related=Essaouira,Agadir,Safi,Ouarzazate
rag.cities.fes.related=Meknes,Taza,Ifrane,Sefrou
rag.cities.tanger.related=Tetouan,Asilah,Chefchaouen,Larache

# Configuration distances géographiques
rag.geography.default.radius.km=50
rag.geography.max.radius.km=200
rag.geography.precision.meters=1000

# ================== CONFIGURATION ANALYSE IA ==================
# Paramètres pour l'analyse des requêtes par IA
rag.ai.analysis.enabled=true
rag.ai.analysis.timeout.seconds=10
rag.ai.analysis.retry.attempts=3
rag.ai.analysis.fallback.enabled=true

# Types d'analyse IA
rag.ai.intent.detection=true
rag.ai.entity.extraction=true
rag.ai.sentiment.analysis=false
rag.ai.category.prediction=true

